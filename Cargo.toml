[package]
name = "nox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
gpui = { package = "gpui-ce", version = "0.3" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3" }
gpui_ce_elements = "0.3"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
gpui = { package = "gpui-ce", version = "0.3", features = ["test-support"] }
