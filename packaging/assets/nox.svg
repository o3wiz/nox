<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="160" y1="100" x2="864" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#192332"/>
      <stop offset="55%" stop-color="#0E1218"/>
      <stop offset="100%" stop-color="#090C11"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#5EEAD4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="260" y1="240" x2="760" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99F6E4"/>
      <stop offset="55%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B4D66" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1D2634" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- macOS/Desktop rounded squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="106" y="106" width="812" height="812" rx="179" fill="none" stroke="url(#rim)" stroke-width="12"/>

  <!-- Subtle log-line texture bars in background -->
  <g fill="#263142" opacity="0.45">
    <rect x="200" y="255" width="210" height="16" rx="8"/>
    <rect x="200" y="305" width="140" height="16" rx="8"/>
    <rect x="650" y="715" width="174" height="16" rx="8"/>
    <rect x="590" y="765" width="234" height="16" rx="8"/>
  </g>

  <!-- Nox crescent moon and star mark (scaled from Icon::NoxMark 24x24) -->
  <g transform="translate(184, 184) scale(27.3333)">
    <path d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 0 0 12 21a9.003 9.003 0 0 0 8.354-5.646Z" fill="url(#moon)"/>
    <circle cx="17.5" cy="6.5" r="1.65" fill="#E0AF4B"/>
  </g>
</svg>
